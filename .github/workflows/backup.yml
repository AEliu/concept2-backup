name: Backup Concept2 & Deploy Web

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Download mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - single
      result_id:
        description: 'Result ID (only needed for single mode)'
        required: false
        type: string

  repository_dispatch:
    types: [c2_new_activity]

concurrency:
  group: c2-backup-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  webhook-preflight:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      duplicate: ${{ steps.lookup.outputs.duplicate }}
      marker_name: ${{ steps.lookup.outputs.marker_name }}
    steps:
      - name: Validate digest and check completed webhook marker
        id: lookup
        env:
          EVENT_DIGEST: ${{ github.event.client_payload.event_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$EVENT_DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Invalid event digest" >&2
            exit 1
          fi
          marker_name="c2-webhook-${EVENT_DIGEST}"
          echo "marker_name=${marker_name}" >> "$GITHUB_OUTPUT"

          run_ids=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${marker_name}&per_page=100" |
            jq -r --arg marker "$marker_name" \
              'if (.artifacts | type) != "array" then error("Invalid artifact response") else (.artifacts[] | select(.name == $marker) | if (.expired | type) != "boolean" then error("Invalid marker status") elif .expired then empty elif (.workflow_run.id | type) != "number" then error("Invalid marker run") else .workflow_run.id end) end')

          duplicate=false
          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            if ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid marker workflow run" >&2
              exit 1
            fi
            valid_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '.conclusion == "success" and .event == "repository_dispatch" and (.path == ".github/workflows/backup.yml" or ((.path // "") | startswith(".github/workflows/backup.yml@")))')
            if [ "$valid_run" = true ]; then
              duplicate=true
              break
            fi
          done <<< "$run_ids"
          echo "duplicate=${duplicate}" >> "$GITHUB_OUTPUT"

  # Job 1: 数据更新 + 前端构建
  backup-and-build:
    needs: webhook-preflight
    if: ${{ always() && github.ref_type == 'branch' && (github.event_name == 'workflow_dispatch' || (needs.webhook-preflight.result == 'success' && needs.webhook-preflight.outputs.duplicate == 'false')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
    
    steps:
      # --- 阶段一：准备代码与 Python 环境 ---
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "scripts/uv.lock"

      - name: Set up Python & Install dependencies
        working-directory: scripts
        run: |
          uv python install 3.13
          uv sync --all-extras --dev

      # --- 阶段二：下载数据 & 生成静态图 ---
      - name: Validate Concept2 Access Token
        if: github.event_name != 'repository_dispatch' || github.event.client_payload.event_type == 'result-added' || github.event.client_payload.event_type == 'result-updated'
        working-directory: scripts
        env:
          C2_ACCESS_TOKEN: ${{ secrets.C2_ACCESS_TOKEN }}
        run: uv run simple_auth.py

      - name: Validate repository dispatch
        if: github.event_name == 'repository_dispatch'
        working-directory: scripts
        env:
          RESULT_ID: ${{ github.event.client_payload.result_id }}
          EVENT_TYPE: ${{ github.event.client_payload.event_type }}
        run: |
          if ! [[ "$RESULT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid result ID" >&2
            exit 1
          fi
          case "$EVENT_TYPE" in
            result-added|result-updated|result-deleted) ;;
            *) echo "Invalid event type" >&2; exit 1 ;;
          esac

      - name: Download single activity (repository dispatch)
        if: github.event_name == 'repository_dispatch' && (github.event.client_payload.event_type == 'result-added' || github.event.client_payload.event_type == 'result-updated')
        working-directory: scripts
        env:
          C2_ACCESS_TOKEN: ${{ secrets.C2_ACCESS_TOKEN }}
          RESULT_ID: ${{ github.event.client_payload.result_id }}
          EVENT_TYPE: ${{ github.event.client_payload.event_type }}
        run: |
          if ! [[ "$RESULT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid result ID" >&2
            exit 1
          fi
          case "$EVENT_TYPE" in
            result-added)
              uv run download_single.py "$RESULT_ID"
              ;;
            result-updated)
              uv run download_single.py "$RESULT_ID" --update
              ;;
            *)
              echo "Invalid event type" >&2
              exit 1
              ;;
          esac

      - name: Record deleted activity (repository dispatch)
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.event_type == 'result-deleted'
        working-directory: scripts
        env:
          RESULT_ID: ${{ github.event.client_payload.result_id }}
        run: |
          if ! [[ "$RESULT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid result ID" >&2
            exit 1
          fi
          uv run record_deleted.py "$RESULT_ID"

      - name: Download single activity (manual trigger)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'single' && github.event.inputs.result_id != ''
        working-directory: scripts
        env:
          C2_ACCESS_TOKEN: ${{ secrets.C2_ACCESS_TOKEN }}
          RESULT_ID: ${{ github.event.inputs.result_id }}
        run: |
          if ! [[ "$RESULT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid result ID" >&2
            exit 1
          fi
          uv run download_single.py "$RESULT_ID"

      - name: Download full history (manual trigger)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full'
        working-directory: scripts
        env:
          C2_ACCESS_TOKEN: ${{ secrets.C2_ACCESS_TOKEN }}
        run: uv run download_history.py

      # 保留 Python 生成的热力图 (用于仓库存档)
      - name: Generate Activity Heatmap (Static)
        if: github.event_name != 'repository_dispatch' || github.event.client_payload.event_type != 'result-deleted'
        working-directory: scripts
        run: uv run update_heatmap.py

      # --- 阶段三：Git 提交 (保存数据变更) ---
      - name: Check for changes
        id: check_changes
        run: |
          git add -f data/
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No backup data changes."
          fi

      - name: Configure git
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "c2-bot@users.noreply.github.com"
          git config --local user.name "C2-Bot"

      - name: Commit changes
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          RESULT_ID: ${{ github.event.client_payload.result_id }}
          EVENT_TYPE: ${{ github.event.client_payload.event_type }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            if [ "$EVENT_TYPE" = "result-deleted" ]; then
              git commit -m "Record deleted activity ${RESULT_ID} [skip ci]"
            else
              git commit -m "Add activity ${RESULT_ID} & Update heatmap [skip ci]"
            fi
          else
            git commit -m "Update activity history & heatmap [skip ci]"
          fi

      - name: Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/push-backup.sh

      # --- 阶段四：前端构建 (Web Build) ---
      # 无论是否有数据更新，我们都重新构建并部署，以防代码本身有更新
      # 如果只想在数据变更时部署，可以在下面步骤加 if
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      

      - name: Install Web Dependencies
        working-directory: ./web
        run: pnpm install

      # 关键步骤：把最新的 data (包括刚才 Python 下载的) 复制到 web/public/data
      # 这样 vite build 时就能打包进去
      - name: Inject Data into Web
        run: |
          # 1. 先强制删除 web/public 下可能存在的软链接/旧文件
          mkdir -p web/public
          rm -f web/public/stats.json
          rm -f web/public/profile-heatmap.png
          
          # 2. 再把真实的数据文件复制过去
          # 注意：根据你之前的修改，App.tsx 读的是根目录 /stats.json
          # 所以我们要复制到 web/public/ 根目录下，而不是 web/public/data/
          cp data/stats.json web/public/stats.json
          
          # 3. 验证一下
          ls -l web/public/

      - name: Build Web App
        working-directory: ./web
        run: pnpm build

      # --- 阶段五：上传构建产物 ---
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: './web/dist'

      # --- 摘要 ---
      - name: Summary
        if: always()
        run: |
          echo "## Status Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ **Data Updated:** Backup data changed." >> $GITHUB_STEP_SUMMARY
            echo "![Heatmap Preview](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/data/profile-heatmap.png?raw=true)" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Data:** No backup data changes." >> $GITHUB_STEP_SUMMARY
          fi
          echo "🚀 **Deployment:** Triggered for GitHub Pages." >> $GITHUB_STEP_SUMMARY

  # Job 2: 部署到 GitHub Pages
  deploy-pages:
    needs: backup-and-build
    if: ${{ !cancelled() && needs.backup-and-build.result == 'success' }}
    
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  mark-webhook-complete:
    needs: [webhook-preflight, backup-and-build, deploy-pages]
    if: ${{ github.event_name == 'repository_dispatch' && needs.webhook-preflight.result == 'success' && needs.webhook-preflight.outputs.duplicate == 'false' && needs.backup-and-build.result == 'success' && needs.deploy-pages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create completion marker
        run: printf 'success\n' > "$RUNNER_TEMP/c2-webhook-complete"

      - name: Upload completion marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.webhook-preflight.outputs.marker_name }}
          path: ${{ runner.temp }}/c2-webhook-complete
          retention-days: 1
          if-no-files-found: error
          overwrite: false
