name: Download Full History

on:
  workflow_dispatch:

concurrency:
  group: c2-backup-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  download-history:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # 2. Install uv (自动处理 Python 环境)
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "scripts/uv.lock"

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: scripts
        run: |
          uv python install 3.13
          uv sync

      # 4. Validate authentication
      - name: Validate Concept2 Access Token
        working-directory: scripts
        env:
          C2_ACCESS_TOKEN: ${{ secrets.C2_ACCESS_TOKEN }}
        run: uv run simple_auth.py

      # 5. Download full history
      - name: Download full workout history
        working-directory: scripts
        env:
          C2_ACCESS_TOKEN: ${{ secrets.C2_ACCESS_TOKEN }}
        run: |
          echo "Downloading full workout history..."
          uv run download_history.py

      # 6. Generate Heatmap (新增步骤：下载完历史当然要重新画图)
      - name: Generate Activity Heatmap
        working-directory: scripts
        run: uv run update_heatmap.py

      # 7. Check for changes (会检测到 data/ 下的新 tcx, json 和 png)
      - name: Check for changes
        id: check_changes
        run: |
          git add -f data/
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new activities to commit."
          fi

      # 8. Configure git
      - name: Configure git
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "c2-bot@users.noreply.github.com"
          git config --local user.name "C2-Bot"

      # 9. Commit and push changes
      - name: Commit changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git commit -m "Update full history & heatmap

          🤖 Automated backup of Concept2 activity history

          Co-authored-by: C2-Bot <c2-bot@users.noreply.github.com>"

      - name: Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/push-backup.sh

      # 10. Summary
      - name: Summary
        run: |
          echo "## Full History Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** Full history download completed" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ New activities downloaded, heatmap updated and committed" >> $GITHUB_STEP_SUMMARY
            # 显示图片
            echo "![Heatmap](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/data/profile-heatmap.png?raw=true)" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ℹ️ No new activities to download" >> $GITHUB_STEP_SUMMARY
          fi
